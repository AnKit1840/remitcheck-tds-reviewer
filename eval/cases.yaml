- id: C10
  group: missing_or_conflict
  title: Invoice contradicts contract
  intake: {payee: Sable Security Inc., amount: 54000}
  contract: |
    Customer may use the Sable threat dashboard online for internal purposes. It receives no right to copy or alter it. Annual fee: USD 45,000.
  invoice: "Invoice 610. Sable dashboard, annual fee. Total due USD 54,000."
  gold:
    route: ESCALATE
    codes: [AMOUNT_CONFLICT]
    contract_amount: ["45000", "USD 45,000"]
    invoice_amount: ["54000", "USD 54,000"]
    facts:
      software_access_only: [yes, "may use the Sable threat dashboard online"]
      copyright_rights_granted: [no, "receives no right to copy or alter it"]
