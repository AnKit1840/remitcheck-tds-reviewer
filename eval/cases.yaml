# ALL CONTRACTS, COMPANIES, INVOICES AND LABELS HERE ARE SYNTHETIC.
# Expected answers were labelled by the author from the cited authorities.
# They have NOT been validated by a practising CA.
defaults:
  currency: USD
  fx_rate: "88.00"
  payee_country: US
  payee_type: company
  remittance_date: "2026-11-15"
  credit_date: "2026-10-31"
  ytd_taxable_inr: 0
  trc_from: "2026-01-01"
  trc_to: "2026-12-31"
  treaty_form_filed: true
  beneficial_owner_declared: true
  no_pe_declared: true
  pan: false
  alt_details_furnished: true
  payee_income_band: up_to_1cr
cases:
- id: C01
  group: clear
  title: Plain SaaS subscription
  intake: {payee: Northwind Cloud Inc., amount: 60000}
  contract: |
    Customer may access the Northwind HR platform through a web browser during the Term for its internal business purposes.
    The annual subscription fee is USD 60,000. Customer receives no right to copy, alter or distribute the platform.
    Standard product support is included. All services are performed from the United States.
  invoice: "Invoice 1001. Northwind HR platform, annual subscription. Total due USD 60,000."
  gold:
    route: READY
    category: BUSINESS_PROFITS_NO_PE
    tds: 0
    forms: Part D
    facts:
      software_access_only: [yes, "may access the Northwind HR platform through a web browser"]
      copyright_rights_granted: [no, "receives no right to copy, alter or distribute the platform"]
